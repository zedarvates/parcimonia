<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Parcimonia : gratuit refusé</title>
  <desc id="desc">Miniature vidéo. La règle gratuite, dont la confiance déclarée est de 0,88, est refusée. Une option KNN à 0,03 et 0,94 est proposée en mode shadow.</desc>
