  <text x="918" y="308" fill="#ffd0a0" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="800">0,88</text>

  <line x1="620" y1="347" x2="1170" y2="347" stroke="#41665c"/>
  <text x="628" y="402" fill="#d9e9e0" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">KNN</text>
