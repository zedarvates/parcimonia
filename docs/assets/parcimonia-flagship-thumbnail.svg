    <linearGradient id="bg" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1818"/>
      <stop offset="1" stop-color="#152726"/>
    </linearGradient>
    <linearGradient id="card" x2="0" y2="1">
      <stop offset="0" stop-color="#19302e"/>
      <stop offset="1" stop-color="#102321"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <path d="M0 614C230 555 386 637 576 570S940 500 1280 580" fill="none" stroke="#315e55" stroke-width="2" opacity=".42"/>
