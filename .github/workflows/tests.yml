name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and test dependencies
        run: python -m pip install --disable-pip-version-check ".[dev,release]"
      - name: Select the Poppler PDF backend on Windows
        if: runner.os == 'Windows'
        shell: python
        run: |
          import hashlib
          import io
          import os
          from pathlib import Path
          import urllib.request
          import zipfile

          url = "https://github.com/oschwartz10612/poppler-windows/releases/download/v26.09.0-0/Release-26.09.0-0.zip"
          expected = "7a6f256a0ddf7536182246a5733331bf4677cbcc34f4663774947ad34556c8d0"
          with urllib.request.urlopen(url, timeout=60) as response:
              data = response.read(64 * 1024 * 1024 + 1)
          assert len(data) <= 64 * 1024 * 1024
          assert hashlib.sha256(data).hexdigest() == expected
          destination = Path(os.environ["RUNNER_TEMP"]) / "parcimonia-poppler"
          destination.mkdir(exist_ok=False)
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              assert sum(item.file_size for item in archive.infolist()) <= 256 * 1024 * 1024
              for item in archive.infolist():
                  path = Path(item.filename)
                  assert not path.is_absolute() and ".." not in path.parts
              archive.extractall(destination)
          executable, = destination.rglob("pdftotext.exe")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as stream:
              stream.write(str(executable.parent) + "\n")
      - name: Build the wheel and source archives
        run: python -m build --no-isolation
      - name: Run the offline test suite
        run: python -m pytest -q
